# Baseline CNN configuration
model: baseline_cnn
seed: 42

data:
  dataset: ham10000
  image_size: 224
  metadata_csv: data/processed/ham10000/metadata.csv
  image_dir: data/processed/ham10000
  split_dir: data/splits
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/processed/testset/metadata.csv
  test_image_dir: data/processed/testset

training:
  batch_size: 32
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  num_workers: 0
  class_weights: true

checkpoint:
  dir: checkpoints

output:
  dir: outputs
  history_csv: outputs/history_baseline.csv
  predictions_csv: outputs/predictions_baseline.csv

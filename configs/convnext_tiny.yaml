# ConvNeXt-Tiny transfer learning configuration
model: convnext_tiny
seed: 42

data:
  dataset: ham10000
  image_size: 224
  metadata_csv: data/processed/ham10000/metadata.csv
  image_dir: data/processed/ham10000
  split_dir: data/splits
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/processed/testset/metadata.csv
  test_image_dir: data/processed/testset

training:
  batch_size: 32
  epochs: 25
  lr: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 7
  num_workers: 0
  class_weights: true

checkpoint:
  dir: checkpoints

output:
  dir: outputs
  history_csv: outputs/history_convnext_tiny.csv
  predictions_csv: outputs/predictions_convnext_tiny.csv

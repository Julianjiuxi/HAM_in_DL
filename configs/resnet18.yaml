project:
  name: HAM_in_DL
  seed: 42

data:
  processed_root: data/processed
  ham10000_root: data/processed/ham10000
  ham10000_metadata_csv: data/processed/ham10000/metadata.csv
  testset_root: data/processed/testset
  test_csv: data/processed/testset/metadata.csv
  split_dir: data/processed/splits
  train_csv: data/processed/splits/train.csv
  val_csv: data/processed/splits/val.csv
  val_size: 0.2
  image_size: 224
  num_workers: 4

model:
  name: resnet18
  num_classes: 7
  pretrained: true
  freeze_backbone: false

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  loss: cross_entropy
  use_class_weights: true
  early_stopping_patience: 8

outputs:
  checkpoint_dir: checkpoints
  figure_dir: outputs/figures
  table_dir: outputs/tables
  prediction_dir: outputs/predictions
  gradcam_dir: outputs/gradcam

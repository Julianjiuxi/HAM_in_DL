# ResNet18 transfer learning configuration
model: resnet18
seed: 42

# Model-specific options
pretrained: true
freeze_backbone: false

data:
  dataset: ham10000
  image_size: 224
  metadata_csv: data/processed/ham10000/metadata.csv
  image_dir: data/processed/ham10000
  split_dir: data/splits
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/processed/testset/metadata.csv
  test_image_dir: data/processed/testset

training:
  batch_size: 128
  epochs: 25
  lr: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 7
  num_workers: 4
  class_weights: true

checkpoint:
  dir: checkpoints

output:
  dir: outputs
  history_csv: outputs/history_resnet18.csv
  predictions_csv: outputs/predictions_resnet18.csv
